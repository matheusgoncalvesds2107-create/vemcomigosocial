<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A2342"><title>Vem Comigo Social</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<div id="auth" class="auth"><div class="authbox"><h1>Vem Comigo Social</h1><p>Conectando corações na fé 🙏✨</p><input id="authName" class="field" placeholder="Seu nome"><input id="authEmail" class="field" type="email" placeholder="E-mail"><input id="authPass" class="field" type="password" placeholder="Senha (mínimo 6)"><div class="row"><button class="btn grow" onclick="login()">Entrar</button><button class="btn alt grow" onclick="signup()">Criar conta</button></div><div id="authMsg" class="muted"></div></div></div>
<div id="app" class="wrap hidden"><header class="top"><div class="brand">Vem Comigo <b>Social</b></div><div class="user"><button class="iconbtn" onclick="go('notificacoes')">🔔 <span id="notifCount" class="badge hidden">0</span></button><img id="topAvatar" class="ava" alt=""><button class="iconbtn" onclick="logout()">Sair</button></div></header>
<section id="inicio" class="page active">
<div class="stories">
  <div class="story"><div class="story-ring"><div>🙏</div></div><small>Orações</small></div>
  <div class="story"><div class="story-ring"><div>🎵</div></div><small>Louvores</small></div>
  <div class="story"><div class="story-ring"><div>📖</div></div><small>Palavra</small></div>
  <div class="story"><div class="story-ring"><div>✨</div></div><small>Testemunhos</small></div>
  <div class="story"><div class="story-ring"><div>🎙️</div></div><small>Podcast</small></div>
  <div class="story"><div class="story-ring"><div>📻</div></div><small>Rádio</small></div>
</div>
<div class="card"><h3>✨ Praça da Família</h3><textarea id="postText" class="field" rows="3" maxlength="1000" placeholder="Compartilhe uma mensagem, testemunho ou versículo..."></textarea><div class="row"><input id="postImage" type="file" accept="image/*" class="grow"><button class="btn" onclick="createPost()">Publicar</button></div><div id="postMsg" class="muted"></div></div><div id="feed"></div></section>
<section id="pessoas" class="page"><div class="card"><h3>🤝 Pessoas</h3><input id="peopleSearch" class="field" placeholder="Buscar por nome..." oninput="loadPeople()"></div><div id="peopleList"></div></section>
<section id="oracoes" class="page"><div class="card"><h3>🙏 Orações e Testemunhos</h3><textarea id="prayerText" class="field" rows="3" maxlength="1000" placeholder="Escreva seu pedido ou testemunho..."></textarea><label><input id="isTestimony" type="checkbox"> É testemunho</label><div class="mt"><button class="btn" onclick="createPrayer()">Publicar</button></div></div><div id="prayerList"></div></section>
<section id="mensagens" class="page"><div class="card"><h3>💬 Mensagens</h3><select id="chatUser" class="field" onchange="loadChat()"><option value="">Escolha uma pessoa</option></select><div id="chat" class="chat"></div><div class="row"><input id="chatText" class="field grow" maxlength="1000" placeholder="Digite uma mensagem..."><button class="btn" onclick="sendMessage()">Enviar</button></div></div></section>
<section id="notificacoes" class="page"><div class="card"><div class="row"><h3 class="grow">🔔 Notificações</h3><button class="btn alt" onclick="markAllRead()">Marcar lidas</button></div></div><div id="notifList"></div></section>
<section id="perfil" class="page"><div class="card profilehero"><img id="profileAvatar" class="ava big" alt=""><h2 id="profileName">Meu Perfil</h2><div id="profileCounts" class="muted"></div></div><div class="card"><h3>Editar perfil</h3><input id="pName" class="field" placeholder="Nome"><textarea id="pBio" class="field" rows="3" placeholder="Bio"></textarea><input id="pVerse" class="field" placeholder="Versículo favorito"><input id="pAvatarFile" type="file" accept="image/*" class="field"><button class="btn" onclick="saveProfile()">Salvar perfil</button><div id="profileMsg" class="muted"></div></div></section>
<nav class="nav"><button class="active" onclick="go('inicio',this)"><span>⌂</span>Início</button><button onclick="go('pessoas',this)"><span>⌕</span>Buscar</button><button onclick="go('oracoes',this)"><span>＋</span>Orações</button><button onclick="go('mensagens',this)"><span>✉</span>Mensagens</button><button onclick="go('notificacoes',this)"><span>♡</span>Avisos</button><button onclick="go('perfil',this)"><span>◉</span>Perfil</button></nav></div>
<script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
